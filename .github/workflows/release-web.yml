name: Release Web image (no deployment)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push a unique release image (never latest; no server access)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure required reviewers on this environment before first publication.
    environment: release-images
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Read-only DB role regression (synthetic data only)
        env:
          ALLOW_PRODUCTION_ROLE_TEST: '1'
        run: node tests/production-role.integration.mjs
      - name: Release API and existing UI tests
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          denoland/deno:2.7.14@sha256:564e989f4a93371e70fd8720e5dbe3e027fd4a0daad71a2b008008596ffa6492
          test --node-modules-dir=none --frozen --allow-read --allow-write
          tests/release-review.test.ts tests/release-web.test.ts
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: inputs.publish
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: kishikawakatsumi/applelocalization-web:release-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable Web image
        if: inputs.publish
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node scripts/web-release-receipt.mjs
      - uses: actions/upload-artifact@v7
        if: inputs.publish
        with:
          name: web-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: web-release.json
          if-no-files-found: error
          retention-days: 90
