name: Test
on:
  pull_request:
    branches: [main]

env:
  FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Collector and release guard regression tests
        run: node --test tests/*.test.mjs
      - name: Candidate initialization and maintenance regression
        env:
          ALLOW_INITIALIZATION_TEST: "1"
        run: node tests/candidate-initialization.integration.mjs
      - name: Build
        run: |
          set -ex
          docker build --rm --no-cache --build-arg FONTAWESOME_TOKEN=${{ env.FONTAWESOME_TOKEN }} .
