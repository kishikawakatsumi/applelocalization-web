name: Test
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Search, URL compatibility and Web tests
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          denoland/deno:2.7.14@sha256:564e989f4a93371e70fd8720e5dbe3e027fd4a0daad71a2b008008596ffa6492
          test --node-modules-dir=none --frozen --allow-read --allow-write
          tests/validation-api.test.ts tests/context-index.test.ts
          tests/language-groups.test.ts tests/release-review.test.ts tests/release-web.test.ts
      - name: Database initialization regression
        env:
          ALLOW_INITIALIZATION_TEST: '1'
        run: node tests/candidate-initialization.integration.mjs
      - name: Build without private registry credentials
        run: docker build -t applelocalization-web:cleanup-test .
      - name: Fresh Compose startup and restart (synthetic data only)
        env:
          ALLOW_COMPOSE_TEST: '1'
        run: node tests/compose-startup.integration.mjs
      - name: VPS memory-limited startup and restart (synthetic data only)
        env:
          ALLOW_COMPOSE_TEST: '1'
          COMPOSE_TEST_LOW_MEMORY: '1'
        run: node tests/compose-startup.integration.mjs
