name: Localization unified candidate database
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push a unique assembled candidate; full restore must be verified locally (never deploy)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: localization-unified-candidate
  cancel-in-progress: false
jobs:
  unified:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test release intake and composition guards
        run: node --test tests/release/release-set.test.mjs tests/release/release-set-image.test.mjs tests/release/release-set-local.test.mjs
      - name: Verify temporary-only maintenance guard and failed-restore refusal on tiny data
        env:
          ALLOW_INITIALIZATION_TEST: "1"
        run: node tests/integration/candidate-initialization.integration.mjs
      - name: Verify immutable SQL artifact pins and successful per-version image audits
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/release-set-image.mjs --mode plan --output "$RUNNER_TEMP/release-plan.json"
      - name: Download pinned ios27 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[0].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[0].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/ios27
          digest-mismatch: error
      - name: Download pinned ios26 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[1].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[1].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/ios26
          digest-mismatch: error
      - name: Download pinned ios18 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[2].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[2].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/ios18
          digest-mismatch: error
      - name: Download pinned ios17 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[3].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[3].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/ios17
          digest-mismatch: error
      - name: Download pinned ios16 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[4].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[4].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/ios16
          digest-mismatch: error
      - name: Download pinned ios15 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[5].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[5].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/ios15
          digest-mismatch: error
      - name: Download pinned macos27 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[6].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[6].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/macos27
          digest-mismatch: error
      - name: Download pinned macos26 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[7].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[7].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/macos26
          digest-mismatch: error
      - name: Download pinned macos15 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[8].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[8].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/macos15
          digest-mismatch: error
      - name: Download pinned macos14 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[9].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[9].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/macos14
          digest-mismatch: error
      - name: Download pinned macos13 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[10].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[10].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/macos13
          digest-mismatch: error
      - name: Download pinned macos12 SQL (no extraction)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ fromJSON(steps.plan.outputs.sources)[11].artifact.id }}
          run-id: ${{ fromJSON(steps.plan.outputs.sources)[11].runId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/sql/macos12
          digest-mismatch: error
      - name: Assemble all verified SQL into one image (full restore pending local validation)
        id: build
        env:
          PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        run: node scripts/release/release-set-image.mjs --mode assemble --plan "$RUNNER_TEMP/release-plan.json" --plan-sha256 "$PLAN_SHA256" --input "$RUNNER_TEMP/sql" --output "$RUNNER_TEMP/unified"
      - uses: docker/login-action@v4
        if: inputs.publish == true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Push unique assembled candidate with explicit restore-pending status
        if: inputs.publish == true
        env:
          ASSEMBLED_SHA256: ${{ steps.build.outputs.assembled_sha256 }}
        run: node scripts/release/release-set-image.mjs --mode push --input "$RUNNER_TEMP/unified/assembled.json" --sha256 "$ASSEMBLED_SHA256" --allow-push --allow-unrestored-candidate --output "$RUNNER_TEMP/unified/pushed.json"
      - name: Retain bounded receipts and capacity diagnostics only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-candidate-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/unified/assembled.json
            ${{ runner.temp }}/unified/pushed.json
            ${{ runner.temp }}/unified/capacity.json
            ${{ runner.temp }}/unified/diagnostics.json
            ${{ runner.temp }}/unified/context/payload/release-set.json
          retention-days: 90
          if-no-files-found: warn
