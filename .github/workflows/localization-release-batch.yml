name: Localization latest release collection batch
on:
  workflow_dispatch:
    inputs:
      allow_download:
        description: Collect selected pinned components; no Release, Docker Hub or database publication
        type: boolean
        required: true
        default: false
      targets:
        description: Comma-separated target IDs or all-ready; only pinned inputs can run
        type: string
        required: true
        default: all-ready
      generate_sql:
        description: Also generate SQL on macOS (normally use the independent Linux candidate pipeline)
        type: boolean
        required: true
        default: false
      publish_candidates:
        description: After collection, trigger independent SQL/image/candidate-push jobs for complete targets only
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: localization-release-batch-20261002-${{ inputs.targets }}
  cancel-in-progress: false
jobs:
  plan:
    if: inputs.allow_download == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: echo "matrix=$(node scripts/collect-release-batch.mjs --mode matrix --targets "$TARGETS")" >> "$GITHUB_OUTPUT"
  collect:
    needs: plan
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      COMPONENT: ${{ matrix.key }}
    steps:
      - name: Set component output directory on assigned runner
        run: echo "OUTPUT=$RUNNER_TEMP/localization-$COMPONENT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Extract and audit all collected languages; keep quarantine originals
        id: extract
        run: node scripts/collect-release-batch.mjs --mode collect --key "$COMPONENT" --output "$OUTPUT" --allow-download
      - name: Save intermediate before SQL generation
        uses: actions/upload-artifact@v7
        with:
          name: intermediate-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT }}/assets/artifact.json
            ${{ env.OUTPUT }}/assets/localization-intermediate.tar
            ${{ env.OUTPUT }}/collection.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Generate logged SQL and verify every exported row (no database connection)
        if: inputs.generate_sql == true
        run: node scripts/collect-release-batch.mjs --mode sql --key "$COMPONENT" --output "$OUTPUT"
      - name: Save verified SQL only
        if: inputs.generate_sql == true
        uses: actions/upload-artifact@v7
        with:
          name: sql-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT }}/sql/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain bounded failure metadata, never source images or keys
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT }}/collect-failure.json
            ${{ env.OUTPUT }}/sql-failure.json
          retention-days: 14
          if-no-files-found: warn
  candidates:
    needs: [plan, collect]
    if: always() && needs.plan.result == 'success' && inputs.publish_candidates == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Trigger independent candidate pipeline for this exact source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run localization-candidate-pipeline.yml --repo "$REPOSITORY" --ref main -f source_run="$SOURCE_RUN" -f targets=all-ready -f publish=true
