name: Localization durable SQL and image candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish NEW SQL prerelease and candidate Docker tag after full verification (never latest or production)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: localization-durable-ios261-os
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    # An ephemeral Linux x64 runner with >=28 GiB FREE is required.
    # Standard runner capacity is not guaranteed; preflight fails without deleting tools/data.
    runs-on: ${{ vars.LOCALIZATION_DURABLE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    outputs:
      sha256: ${{ steps.prepare.outputs.sha256 }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Offline regression tests (no database or publication credentials)
        run: node --test tests/*.test.mjs
      - name: Download pinned intermediate, generate SQL, build image and verify complete restore
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ runner.temp }}/durable-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/durable-actions.mjs --mode prepare --output "$OUTPUT"
      - name: Retain verified allowlisted distribution (no PGDATA or credentials)
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: durable-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/durable-${{ github.run_id }}-${{ github.run_attempt }}/distribution/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain limited failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: durable-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/durable-${{ github.run_id }}-${{ github.run_attempt }}/startup/failure.json
            ${{ runner.temp }}/durable-${{ github.run_id }}-${{ github.run_attempt }}/image/build.log
            ${{ runner.temp }}/durable-${{ github.run_id }}-${{ github.run_attempt }}/guards.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: verify
    if: inputs.publish == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Configure required reviewers + main-only deployment restriction BEFORE enabling publish.
    environment: localization-data-publication
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/durable-distribution
          digest-mismatch: error
      - name: Reverify exact same-run artifacts before accessing publication credentials
        env:
          INPUT: ${{ runner.temp }}/durable-distribution
          SHA256: ${{ needs.verify.outputs.sha256 }}
        run: node scripts/durable-actions.mjs --mode verify --input "$INPUT" --sha256 "$SHA256"
      - name: Check explicitly configured publication destination
        env:
          TARGET_COMMIT: ${{ vars.LOCALIZATION_DATA_TARGET_COMMIT }}
          DATA_TOKEN: ${{ secrets.LOCALIZATION_DATA_RELEASE_TOKEN }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DATA_TOKEN"
          test -n "$HUB_USER"
          test -n "$HUB_TOKEN"
          [[ "$TARGET_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create new SQL draft, push unique candidate image, then publish SQL prerelease
        env:
          INPUT: ${{ runner.temp }}/durable-distribution
          SHA256: ${{ needs.verify.outputs.sha256 }}
          TARGET_COMMIT: ${{ vars.LOCALIZATION_DATA_TARGET_COMMIT }}
          GH_TOKEN: ${{ secrets.LOCALIZATION_DATA_RELEASE_TOKEN }}
        run: node scripts/durable-actions.mjs --mode publish --input "$INPUT" --sha256 "$SHA256" --target-commit "$TARGET_COMMIT" --allow-public-data
