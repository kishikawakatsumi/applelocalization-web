# Independent of all application/database generations. Linux VPS only.
services:
  proxy:
    image: caddy:2.11.9-alpine@sha256:71d41fe4b1ae92a058abc87afe614178b996d8a6b96d0f4c71ae30606e5927e3
    platform: linux/amd64
    restart: unless-stopped
    network_mode: host
    command: [caddy, run, --config, /etc/localization/Caddyfile, --adapter, caddyfile]
    volumes:
      - .:/etc/localization:ro
      - config:/config
      - data:/data
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  config: {}
  data: {}
