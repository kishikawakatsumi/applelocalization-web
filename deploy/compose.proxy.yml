# Independent of all application/database generations. Linux VPS only.
services:
  proxy:
    image: caddy:2.11.8-alpine@sha256:3db3a09e418f86a8fce8de4bc0026fccd2b4cd925aef00cc7d843d9fdc75e442
    platform: linux/amd64
    restart: unless-stopped
    network_mode: host
    command: [caddy, run, --config, /etc/localization/Caddyfile, --adapter, caddyfile]
    volumes:
      - .:/etc/localization:ro
      - config:/config
      - data:/data
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  config: {}
  data: {}
