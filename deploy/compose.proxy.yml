# Independent of all application/database generations. Linux VPS only.
services:
  proxy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    platform: linux/amd64
    restart: unless-stopped
    network_mode: host
    command: [caddy, run, --config, /etc/localization/Caddyfile, --adapter, caddyfile]
    volumes:
      - .:/etc/localization:ro
      - config:/config
      - data:/data
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  config: {}
  data: {}
