# Independent of all application/database generations. Linux VPS only.
services:
  proxy:
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    platform: linux/amd64
    restart: unless-stopped
    network_mode: host
    command: [caddy, run, --config, /etc/localization/Caddyfile, --adapter, caddyfile]
    volumes:
      - .:/etc/localization:ro
      - config:/config
      - data:/data
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  config: {}
  data: {}
